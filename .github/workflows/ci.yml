name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install GPUI Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake binutils nasm libasound2-dev libfontconfig-dev \
            libglib2.0-dev libssl-dev libvulkan1 libwayland-dev \
            libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Pure core dependency boundaries
        run: python3 scripts/check-editor-core-boundary.py

      - name: Workspace tests
        run: cargo test --locked --workspace

      - name: Workspace check
        run: cargo check --locked --workspace

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Link application
        run: cargo build --locked -p a-less-awful-editor
